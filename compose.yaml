version: "2.1"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${SHOP_BIND_IP:-127.0.0.1}:${SHOP_PORT:-8088}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      APP_NAME: Tiho
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Create root .env with APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8088}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-fkn}
      DB_USERNAME: ${DB_USERNAME:-fkn}
      DB_PASSWORD: ${DB_PASSWORD:?Create root .env with DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fkn}
      POSTGRES_USER: ${DB_USERNAME:-fkn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create root .env with DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fkn} -d ${DB_DATABASE:-fkn}"]
      interval: 3s
      retries: 20
    restart: unless-stopped


volumes:
  pgdata:
